# Safety net: every time you push, GitHub re-runs the server tests and checks the app code for mistakes.
# A red ✗ next to your commit (and an email) means something is broken — paste the log to Claude before shipping
# the app update to phones. Takes ~2 minutes.
name: Checks

on:
  push:
    paths: ["api/**", "mobile/**", "mobile-files/**", ".github/workflows/checks.yml"]
  workflow_dispatch: {}

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt -r requirements-pipeline.txt
      - run: python -m tests.run
        env:
          STORAGE: local

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # React Native 0.88 needs Node 22+
      - name: Type check (finds typos, missing files, wrong names)
        run: |
          APPDIR=$(for d in mobile mobile-files; do [ -f "$d/package.json" ] && echo "$d" && break; done)
          [ -n "$APPDIR" ] || { echo "No app folder with package.json found — skipping"; exit 0; }
          cd "$APPDIR"
          npm ci || npm install
          if [ -f tsconfig.check.json ]; then CFG=tsconfig.check.json; else CFG=.; fi
          npx --yes -p typescript tsc --noEmit -p "$CFG"
