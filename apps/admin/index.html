<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Channel Nav Admin</title>
<meta name="theme-color" content="#0A1622">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CN Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" type="image/png" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0A1622;--panel:#102131;--panel2:#152A3E;--line:#223B53;--text:#EAF1F7;--muted:#9FB3C6;--accent:#4C9BEA;--accentBg:rgba(76,155,234,.16);--btn:#1F6FC8;--live:#62CBE2;--alert:#FF7A68;--ok:#45C277;--warnc:#F2B544;--tabh:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif}
a{color:var(--accent)}
#app{display:flex;min-height:100vh}
#side{width:248px;flex:0 0 248px;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
#content{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px}
.brand .mark{width:36px;height:36px;border-radius:9px;border:1px solid #2A5D8F;display:block}
.brand .nm{font-weight:800;font-size:16px;letter-spacing:.02em;line-height:1.1}.brand .nm small{display:block;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.08em}
.grp{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:14px 10px 4px}
.navi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--text);font:inherit;font-size:14.5px;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer}
.navi svg{flex:0 0 18px;color:var(--muted)}@media (hover:hover){.navi:hover{background:var(--panel)}}
.navi.on{background:var(--accentBg);color:#A9CFF6;font-weight:600}.navi.on svg{color:var(--accent)}
.badge{margin-left:auto;background:var(--alert);color:#1A0805;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.who{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px;word-break:break-all}
.who a{display:inline-block;padding:6px 0;margin-right:14px}
#top{display:none}
main{padding:24px 28px 40px;max-width:1240px;margin:0 auto}
h2{font-size:22px;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}
.sec{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:22px 2px 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;overflow-x:auto}
input,select,textarea{background:#0C1B29;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px;width:100%}
label{display:block;color:var(--muted);font-size:12.5px;margin:10px 0 4px}
button.act{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-height:40px;cursor:pointer;margin:4px 4px 0 0;font:inherit;font-size:14px}
button.primary{background:var(--btn);color:#FFFFFF;border-color:var(--btn);font-weight:700}button.danger{border-color:var(--alert);color:var(--alert)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
.muted{color:var(--muted);font-size:13px}.warn{color:var(--warnc)}.bad{color:var(--alert)}.good{color:var(--ok)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.card.warn{border-color:#5A4A1E}.card.bad{border-color:#5A2A24}.card.good{border-color:#1F4A30}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--muted)}
pre{white-space:pre-wrap;word-break:break-word;background:#0C1B29;padding:8px;border-radius:8px;margin:6px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--text);font:inherit;position:relative;width:100%}
button.kpi{cursor:pointer}@media (hover:hover){button.kpi:hover{border-color:#36597C;background:var(--panel2)}}button.kpi:active{transform:scale(.98)}
.kpi .v{font-size:28px;font-weight:800;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}.kpi .k{color:var(--muted);font-size:12.5px;font-weight:600;padding-right:16px}.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.kpi .chev{position:absolute;right:12px;top:12px;color:var(--muted);font-size:18px;line-height:1}
.kpi.hot{border-color:#7A3B32;background:#2A1714}.kpi.hot .v{color:var(--alert)}
.alertbar{display:flex;align-items:center;gap:12px;width:100%;background:#2A1714;border:1px solid #7A3B32;color:var(--text);border-radius:14px;padding:14px 16px;font:inherit;text-align:left;cursor:pointer;margin-bottom:6px}
.alertbar b{color:var(--alert)}.alertbar span{margin-left:auto;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;height:280px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar b{font-size:22px}.toolbar select,.toolbar input{width:auto}
.ret td{text-align:center}.ret td:first-child{text-align:left}
#tabbar{display:none}#tabbar:empty{display:none!important}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
#sheet .pane{background:var(--bg);width:100%;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:10px 14px calc(18px + env(safe-area-inset-bottom))}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
#sheet .navi{padding:13px 10px;font-size:16px}
#kit{background:#fff;color:#111;border-radius:12px;padding:28px;max-width:860px}#kit h1{margin:0 0 4px;font-size:28px}#kit .muted{color:#555}#kit .kpi{background:#f4f6f8;border-color:#dde3e8;color:#111}#kit .kpi .k,#kit .kpi .s{color:#555}
#kit table td,#kit table th{border-color:#e3e7ea;color:#111}
@media (max-width:899px){
  #side{display:none}
  #top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:rgba(10,22,34,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  #top h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{padding:14px 14px calc(var(--tabh) + 28px + env(safe-area-inset-bottom))}
  main>h2:first-child,.toolbar>b:first-child{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:12px}.kpi .v{font-size:24px}.kpi .k{font-size:12px}.kpi .s{font-size:11.5px}
  .chartbox{height:230px}
  .toolbar select,.toolbar input{flex:1;min-width:0}
  #tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(10,22,34,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  #tabbar button{background:none;border:0;color:var(--muted);font:inherit;font-size:10.5px;font-weight:600;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
  #tabbar button.on{color:var(--accent)}
  #tabbar .badge{position:absolute;top:8px;left:calc(50% + 6px);margin:0}
}
@media print{#side,#top,#tabbar,.toolbar,.noprint{display:none!important}body{background:#fff}main{padding:0}#kit{max-width:none;border-radius:0}}
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Admin sections">
    <div class="brand"><img class="mark" src="icon-180.png?v=2" alt="" aria-hidden="true">
      <div class="nm">CHANNEL NAV<small>ADMIN</small></div></div>
    <div id="sidenav"></div>
    <div class="who"></div>
  </aside>
  <div id="content">
    <header id="top"><div class="brand" style="padding:0"><img class="mark" src="icon-180.png?v=2" alt="" aria-hidden="true"></div><h1 id="title">Admin</h1></header>
    <main id="main"><div class="card">Loading…</div></main>
  </div>
</div>
<nav id="tabbar" aria-label="Main sections"></nav>
<div id="sheet" hidden><div class="pane" role="dialog" aria-label="All sections"><div class="grab"></div><div id="sheetnav"></div><div class="who" style="border-top:1px solid var(--line);margin-top:10px"></div></div></div>
<script>
// ---------- setup ----------
if (/[?&]reset\b/.test(location.search)) { localStorage.removeItem('admin-cfg'); history.replaceState(null, '', location.pathname); }
const cfg = JSON.parse(localStorage.getItem('admin-cfg') || 'null');
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (t) => { if (!t) return 'never'; const h = (Date.now() - new Date(t)) / 36e5; return h < 1 ? `${Math.round(h * 60)} min ago` : h < 48 ? `${Math.round(h)} h ago` : `${Math.round(h / 24)} days ago`; };
let sb, me;

function setupForm() {
  $('#main').innerHTML = `<div class="card"><h2>Connect</h2><p class="muted">Saved in this browser only. Use the public anon key — never the service_role key.</p>
  <label>Supabase URL</label><input id="u" placeholder="https://xxxx.supabase.co"><label>Supabase anon public key</label><input id="k">
  <label>API URL (Render)</label><input id="a" placeholder="https://fishing-app-api.onrender.com"><br><br><button class="act primary" id="save">Save</button></div>`;
  $('#save').onclick = () => { localStorage.setItem('admin-cfg', JSON.stringify({ url: $('#u').value.trim(), key: $('#k').value.trim(), api: $('#a').value.trim().replace(/\/$/, '') })); location.reload(); };
}

async function signIn() {
  $('#main').innerHTML = `<div class="card"><h2>Sign in</h2><label>Email</label><input id="em"><button class="act primary" id="send">Email me a code</button>
  <div id="codebox" hidden><label>Code from the email</label><input id="code"><button class="act primary" id="ver">Sign in</button></div><p id="msg" class="muted"></p>
  <p class="muted" style="margin-top:18px">Connected to ${esc(cfg.url || '(no Supabase URL)')} · <a href="#" id="chg" style="color:var(--live)">Change connection</a></p></div>`;
  $('#chg').onclick = (e) => { e.preventDefault(); localStorage.removeItem('admin-cfg'); location.reload(); };
  $('#send').onclick = async () => {
    try {
      const { error } = await sb.auth.signInWithOtp({ email: $('#em').value.trim(), options: { shouldCreateUser: false } });
      $('#msg').textContent = error ? error.message : 'Code sent.'; if (!error) $('#codebox').hidden = false;
    } catch (e) {
      $('#msg').textContent = "Couldn't reach Supabase. The Supabase URL saved on this device is probably wrong: tap Change connection and enter it again.";
    }
  };
  $('#ver').onclick = async () => { const { error } = await sb.auth.verifyOtp({ email: $('#em').value.trim(), token: $('#code').value.trim(), type: 'email' }); if (error) $('#msg').textContent = error.message; else location.reload(); };
}

const TABS = { Overview: overview, Audience: audience, Engagement: engagement, 'Ads & reports': adsReports, 'Media kit': mediaKit, Sponsors: sponsors, Users: users, Moderation: moderation, Spots: spots, Categories: categories, Broadcast: broadcast, 'San Clemente': sanClemente, Announcements: announcements, Settings: settings, 'Feedback & crashes': feedback, 'Data health': health, 'Audit log': audit };
// Sections, grouped like a phone settings app. On a phone: a bottom tab bar (the four you use most + More);
// on a computer: a left sidebar. Every number card on Overview is a button that opens the section behind it.
const GROUPS = [
  ['Today', ['Overview', 'Moderation', 'Feedback & crashes']],
  ['People', ['Users', 'Audience', 'Engagement']],
  ['Sponsors & ads', ['Sponsors', 'Ads & reports', 'Media kit']],
  ['Content', ['San Clemente', 'Spots', 'Categories', 'Announcements', 'Broadcast']],
  ['System', ['Settings', 'Data health', 'Audit log']],
];
const TABBAR = [['Overview', 'Overview'], ['Moderation', 'Moderation'], ['Sponsors', 'Sponsors'], ['Feedback & crashes', 'Feedback']];
const IC = {
  Overview: '<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 7h6V4h-6z"/>',
  Moderation: '<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  'Feedback & crashes': '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-5A8 8 0 1 1 21 12z"/>',
  Users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/>',
  Audience: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  Engagement: '<path d="M3 17l5-5 4 4 8-9"/><path d="M14 7h6v6"/>',
  Sponsors: '<path d="M3 11l14-6v14L3 13z"/><path d="M7 12.5V18a2 2 0 0 0 4 0v-3.5"/>',
  'Ads & reports': '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  'Media kit': '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  Spots: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/>',
  Categories: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  Announcements: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  'San Clemente': '<path d="M12 3l9 16H3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".6"/>',
  Broadcast: '<path d="M5 12a7 7 0 0 1 14 0M8.5 12a3.5 3.5 0 0 1 7 0"/><circle cx="12" cy="12" r="1"/><path d="M12 13v8"/>',
  Settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15.1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  'Data health': '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  'Audit log': '<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/>',
  More: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
};
const icon = (t, size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[t] || ''}</svg>`;
let current = 'Overview', modCount = 0;
const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const fromSlug = (h) => Object.keys(TABS).find((t) => slug(t) === h);
const badge = (t) => (t === 'Moderation' && modCount > 0 ? `<span class="badge">${modCount}</span>` : '');
function nav(active) {
  const list = GROUPS.map(([g, ts]) => `<div class="grp">${esc(g)}</div>` + ts.map((t) =>
    `<button class="navi${t === active ? ' on' : ''}" data-go="${esc(t)}" aria-current="${t === active ? 'page' : 'false'}">${icon(t)}<span>${esc(t)}</span>${badge(t)}</button>`).join('')).join('');
  $('#sidenav').innerHTML = list; $('#sheetnav').innerHTML = list;
  const inBar = TABBAR.some(([t]) => t === active);
  $('#tabbar').innerHTML = TABBAR.map(([t, short]) => `<button class="${t === active ? 'on' : ''}" data-go="${esc(t)}" aria-label="${esc(t)}">${icon(t, 22)}<span>${esc(short)}</span>${badge(t)}</button>`).join('')
    + `<button class="${inBar ? '' : 'on'}" id="more" aria-label="More sections">${icon('More', 22)}<span>More</span></button>`;
  $('#more').onclick = () => { $('#sheet').hidden = false; };
  $('#title').textContent = active;
  document.title = `${active} · Channel Nav Admin`;
}
async function show(t) {
  if (!TABS[t]) t = 'Overview';
  current = t; $('#sheet').hidden = true; clearCharts(); nav(t);
  if (location.hash !== '#' + slug(t)) history.pushState(null, '', '#' + slug(t));
  window.scrollTo(0, 0);
  $('#main').innerHTML = '<div class="card">Loading…</div>';
  try { await TABS[t](); } catch (e) { $('#main').innerHTML = `<div class="card bad">${esc(e.message || e)}</div>`; }
}
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); show(g.dataset.go); return; }
  if (e.target.id === 'sheet') $('#sheet').hidden = true;
});
window.addEventListener('popstate', () => { const t = fromSlug(location.hash.slice(1)) || 'Overview'; if (t !== current) show(t); });
const must = ({ data, error }) => { if (error) throw error; return data; };


// ---------- shared: numbers & charts ----------
const fmt = (n) => (n == null ? '—' : Number(n).toLocaleString());
const pct = (a, b) => (b ? `${Math.round((1000 * a) / b) / 10}%` : '—');
const charts = [];
function chart(id, type, labels, datasets, opts = {}) {
  const el = document.getElementById(id); if (!el) return;
  const palette = ['#62CBE2', '#F5A524', '#3fb950', '#c58cff', '#FF7A68', '#9aa9b8'];
  charts.push(new Chart(el, { type, data: { labels, datasets: datasets.map((d, i) => ({ borderColor: palette[i % 6], backgroundColor: type === 'line' ? palette[i % 6] + '22' : palette[i % 6], fill: type === 'line', tension: 0.25, pointRadius: 0, borderWidth: 2, ...d })) },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#A3B4C1' } } }, scales: type === 'doughnut' ? {} : { x: { ticks: { color: '#A3B4C1', maxTicksLimit: 10 }, grid: { color: '#1b2c3a' } }, y: { beginAtZero: true, ticks: { color: '#A3B4C1' }, grid: { color: '#1b2c3a' } } }, ...opts } }));
}
const clearCharts = () => { while (charts.length) charts.pop().destroy(); };
/** A number card. With `go` (a section name) it's a button that opens that section. */
const kpi = (k, v, sub = '', go = '', hot = false) => go
  ? `<button type="button" class="kpi${hot ? ' hot' : ''}" data-go="${esc(go)}" aria-label="${esc(k)}: ${esc(v)}. Open ${esc(go)}"><span class="chev" aria-hidden="true">›</span><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(sub)}</div></button>`
  : `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(sub)}</div></div>`;
async function metricsRange(days) {
  const from = new Date(Date.now() - days * 864e5).toISOString().slice(0, 10);
  return must(await sb.from('metrics_daily').select('day,data').gte('day', from).order('day'));
}
const avg = (rows, k) => (rows.length ? Math.round(rows.reduce((a, r) => a + (Number(r.data[k]) || 0), 0) / rows.length) : 0);
const sum = (rows, k) => rows.reduce((a, r) => a + (Number(r.data[k]) || 0), 0);

// ---------- Overview ----------
async function overview(days = 90) {
  clearCharts();
  const [live, rows] = await Promise.all([sb.rpc('admin_live').then(must), metricsRange(days)]);
  const last30 = rows.slice(-30);
  modCount = Number(live.moderation_open) || 0; nav('Overview');
  const avgMin = last30.length ? (last30.reduce((a, r) => a + (Number(r.data.avg_session_min) || 0), 0) / last30.length).toFixed(1) : '—';
  $('#main').innerHTML = `<h2>Overview</h2>
  ${modCount ? `<button type="button" class="alertbar" data-go="Moderation">${icon('Moderation', 22)}<div><b>${fmt(modCount)} waiting for review</b><div class="muted">Apple requires reports to be handled within 24 hours</div></div><span>›</span></button>` : ''}

    chart('r1', 'line', d.map((x) => x.d.slice(5)), [{ label: 'Impressions', data: d.map((x) => x.imp) }, { label: 'Daily reach', data: d.map((x) => x.reach) }]);

  <h1>${esc(c.advertiser)} · ${esc(c.name)}</h1><p>${esc((c.starts_at || '').slice(0, 10))} to ${esc((c.ends_at || '').slice(0, 10))} · placement: ${esc(c.placement)}${c.presented_by_section ? ' · ' + esc(c.presented_by_section) : ''}</p>
  <div><span class="k">Impressions<b>${fmt(t.impressions)}</b></span><span class="k">Clicks<b>${fmt(t.clicks)}</b></span><span class="k">Click-through<b>${pct(t.clicks, t.impressions)}</b></span><span class="k">Daily reach (sum)<b>${fmt(t.daily_reach_sum)}</b></span></div>
  <h3>Where it was seen</h3><table>${(r.areas || []).map((x) => `<tr><td>${esc(x.k)}</td><td>${fmt(x.n)}</td></tr>`).join('')}</table>
  <h3>By day</h3><table><tr><th>Day</th><th>Impressions</th><th>Clicks</th><th>Reach</th></tr>${d.map((x) => `<tr><td>${esc(x.d)}</td><td>${fmt(x.imp)}</td><td>${fmt(x.clk)}</td><td>${fmt(x.reach)}</td></tr>`).join('')}</table>
  <p style="color:#666;font-size:12px">Counts from the app's own sponsor server. Impressions are counted when the sponsor is shown on screen; reach counts unique phones per day using an anonymous daily ID. No personal data or exact locations are collected.</p>
  <script>window.print()<\/script></body></html>`);
  w.document.close();
}

  <td><button class="act" data-u="${u.id}" data-op="verified" data-v="${!u.verified_reporter}">${u.verified_reporter ? 'Remove badge' : 'Give badge'}</button>

  <button class="act" data-u="${u.id}" data-op="admin" data-v="${!u.is_admin}">${u.is_admin ? 'Remove admin' : 'Make admin'}</button></td></tr>`).join('')}</table></div>`;

// ---------- San Clemente Island closures (Oct 28) ----------
// Sets app_config.sci_closures. Phones show it on the map within ~5 minutes; people with "San Clemente closures"
// alerts get a push within ~1 minute (server: api/sci/alerts.py). Section G and Wilson Cove are always restricted.
async function sanClemente() {
  const row = must(await sb.from('app_config').select('value').eq('key', 'sci_closures').maybeSingle());
  if (!row) { $('#main').innerHTML = '<div class="card bad">Run db/migrations/014_san_clemente.sql in Supabase first (SQL Editor → paste → Run).</div>'; return; }
  const cfg = row.value || {}; const secs = cfg.sections || {};
  const WHERE = { A: 'Northwest end · Northwest Harbor', B: 'East side · north half', C: 'East side · south half', D: 'South end · Pyramid Cove / China Point', E: 'West side · south', F: 'West side · middle' };
  const local = (iso) => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
  const now = Date.now();
  const stat = (k) => { const s = secs[k] || {}; if (!s.closed) return ['open', 'good']; if (s.until && now >= Date.parse(s.until)) return ['open (closure ended)', 'good']; if (s.from && now < Date.parse(s.from)) return ['scheduled', 'warn']; return ['CLOSED', 'bad']; };
  $('#main').innerHTML = `<h2>San Clemente Island</h2>
  <div class="card"><p class="muted">Tick a section when the Navy closes it (Navy schedule, VHF 16, a captain's report). "From" empty = closed now. "Until" empty = until you untick it. When "Until" passes it opens again by itself. Phones show it on the map within ~5 minutes, and everyone with <b>San Clemente closures</b> alerts gets a push within about a minute (plus a heads-up 18 hours before a scheduled closure). Section G and Wilson Cove are always restricted — nothing to set.</p>
  <div class="toolbar"><button class="act" id="sc_all">Tick all A–F</button><button class="act" id="sc_none">Open everything</button></div>
  <table><tr><th>Section</th><th>Closed</th><th>From (optional)</th><th>Until (optional)</th><th>Now</th></tr>
  ${['A', 'B', 'C', 'D', 'E', 'F'].map((k) => { const s = secs[k] || {}; const [t, c] = stat(k); return `<tr><td><b>${k}</b><div class="muted">${esc(WHERE[k])}</div></td>
    <td><input type="checkbox" data-sc="${k}" style="width:auto" ${s.closed ? 'checked' : ''}></td>
    <td><input type="datetime-local" data-from="${k}" value="${local(s.from)}"></td><td><input type="datetime-local" data-until="${k}" value="${local(s.until)}"></td>
    <td class="${c}">${esc(t)}</td></tr>`; }).join('')}
  </table>
  <label>Note shown in the app and the alert (optional, e.g. "Navy shore bombardment, Pyramid Cove")</label><input id="sc_note" maxlength="120" value="${esc(cfg.note || '')}">
  <button class="act primary" id="sc_save">Save &amp; send</button>
  <p class="muted">${cfg.updated_at ? `Last saved ${esc(new Date(cfg.updated_at).toLocaleString())}` : 'Not set yet.'}</p></div>
  <div class="card"><h3>Where to check</h3><p class="muted">Navy schedule: scisland.org · FACSFAC San Diego 619-545-4742 / VHF 16 · Coast Guard Local Notice to Mariners (District 11). Rule: 33 CFR 165.1141.</p></div>`;
  $('#sc_all').onclick = () => document.querySelectorAll('[data-sc]').forEach((x) => (x.checked = true));
  $('#sc_none').onclick = () => document.querySelectorAll('[data-sc]').forEach((x) => (x.checked = false));
  $('#sc_save').onclick = async () => {
    const iso = (v) => (v ? new Date(v).toISOString() : null);
    const sections = {};
    for (const k of ['A', 'B', 'C', 'D', 'E', 'F']) {
      const closed = document.querySelector(`[data-sc="${k}"]`).checked;
      const from = iso(document.querySelector(`[data-from="${k}"]`).value), until = iso(document.querySelector(`[data-until="${k}"]`).value);
      if (from && until && Date.parse(until) <= Date.parse(from)) return alert(`Section ${k}: "Until" must be after "From".`);
      if (closed) sections[k] = { closed: true, from, until };
    }
    const list = Object.keys(sections);
    if (!confirm(list.length ? `Save: Section${list.length > 1 ? 's' : ''} ${list.join(', ')} closed. People with San Clemente alerts get a push. OK?` : 'Save: everything open. People with San Clemente alerts get a "reopened" push if anything was closed. OK?')) return;
    const value = { sections, note: $('#sc_note').value.trim() || null, updated_at: new Date().toISOString() };
    must(await sb.from('app_config').update({ value, updated_at: value.updated_at }).eq('key', 'sci_closures'));
    sanClemente();
  };
}

  <p class="muted">Changes take effect the next time each phone opens the app.</p></div>
  <div class="card"><h3>Store numbers</h3><p class="muted">Downloads only exist in App Store Connect (Trends) and Google Play Console (Statistics). Type them here — one row per day, or paste a CSV: <code>2026-10-01,ios,downloads,42</code></p>

  }));

  };
}

// ---------- moderation ----------
async function moderation() {
  const q = must(await sb.from('moderation_queue').select('*').order('created_at', { ascending: false }).limit(200));
  const seen = new Set(); const items = q.filter((r) => (seen.has(r.target_id) ? false : seen.add(r.target_id)));
  const blocks = await Promise.all(items.map(async (r) => {
    let body = '', author = null;
    if (r.target_type === 'post') { const p = (await sb.from('posts').select('*').eq('id', r.target_id).maybeSingle()).data; if (p) { author = p.author_id; body = `<b>${esc(p.title)}</b><pre>${esc(p.body)}</pre><span class="pill">${esc(p.moderation_status)}</span>`; } }
    if (r.target_type === 'comment') { const c = (await sb.from('comments').select('*').eq('id', r.target_id).maybeSingle()).data; if (c) { author = c.author_id; body = `<pre>${esc(c.body)}</pre><span class="pill">${esc(c.moderation_status)}</span>`; } }
    if (r.target_type === 'catch') { const c = (await sb.from('catch_reports').select('id,user_id,caught_at,quantity,weight_lb,technique,bait,notes,location_mode,verification_status,species(code,name)').eq('id', r.target_id).maybeSingle()).data; if (c) { author = c.user_id; body = `${esc(c.species?.name)} × ${esc(c.quantity)} ${c.weight_lb ? esc(c.weight_lb) + ' lb' : ''} · ${esc(c.technique || '')} ${esc(c.bait || '')} · ${esc(new Date(c.caught_at).toLocaleString())}<pre>${esc(c.notes || '')}</pre><span class="pill">${esc(c.verification_status)}</span> <span class="pill">${esc(c.location_mode)}</span>`; } }
    return `<div class="card"><div class="muted">${esc(r.target_type)} · ${esc(r.reason)} · ${esc(r.open_reports)} open report(s) · ${ago(r.created_at)}</div>${body || '<i class="muted">Already deleted</i>'}
      <div><button class="act danger" data-a="removed" data-t="${esc(r.target_type)}" data-id="${esc(r.target_id)}">Remove</button>
      <button class="act" data-a="hidden" data-t="${esc(r.target_type)}" data-id="${esc(r.target_id)}">Hide</button>
      <button class="act" data-a="visible" data-t="${esc(r.target_type)}" data-id="${esc(r.target_id)}">Restore / dismiss reports</button>
      ${author ? `<button class="act danger" data-suspend="${esc(author)}">Suspend author 7 days</button>` : ''}</div></div>`;
  }));
  $('#main').innerHTML = `<h2>Moderation queue (${items.length})</h2>` + (blocks.join('') || '<div class="card good">Nothing waiting. 🎉</div>');
  document.querySelectorAll('[data-a]').forEach((b) => (b.onclick = async () => {
    const note = prompt('Note for the audit log (optional)') ?? '';
    must(await sb.rpc('moderate', { target_type: b.dataset.t, target_id: b.dataset.id, action: b.dataset.a === 'hidden' && b.dataset.t === 'catch' ? 'removed' : b.dataset.a, note })); moderation();
  }));
  document.querySelectorAll('[data-suspend]').forEach((b) => (b.onclick = async () => {
    const note = prompt('Reason (goes in the audit log)'); if (note === null) return;
    must(await sb.rpc('suspend_user', { target: b.dataset.suspend, until_ts: new Date(Date.now() + 7 * 864e5).toISOString(), note })); alert('Suspended for 7 days.');
  }));
}

const SECTIONS = ['Today', 'Weather', 'Catch Map', 'SST Map', 'Wind', 'Radar', 'Map Layers', 'Harbors', 'Offshore Conditions', 'Catalina Report'];
const AD_SPACES = [
  ['Weather "presented by"', 'presented_by · Weather', 'Top of the Weather tab', 'One line + logo, 1 sponsor/week'],
  ['Weather banner', 'banner_weather', 'Middle of Weather, after the hourly forecast', 'Max 1 per screen'],
  ['Today "presented by"', 'presented_by · Today', 'Top of the Today sheet', '1 sponsor/week'],
  ['Today banner', 'banner_dashboard', 'Bottom of the Today sheet', 'Max 1 per screen'],
  ['Water temp "presented by"', 'presented_by · SST Map', 'Water-temp time bar', '1 sponsor/week'],
  ['Wind "presented by"', 'presented_by · Wind', 'Small pill above the map buttons when Wind is on', 'Hidden while navigating or recording'],
  ['Radar "presented by"', 'presented_by · Radar', 'Under the radar time label', 'Hidden while navigating or recording'],
  ['Map options "presented by"', 'presented_by · Map Layers', 'Top of the Map options sheet', 'Only while the sheet is open'],
  ['Harbor cards "presented by"', 'presented_by · Harbors', 'Bottom of every harbor/fuel/bait info card', 'Matched to fuel/bait/marina'],
  ['Featured business pin', 'featured_listing', 'Gold ★ pin on the map at the business', 'Only with Fuel/Bait/Marinas on, zoomed in, max 4, never while navigating'],
  ['Catch Map "presented by"', 'presented_by · Catch Map', 'Catch filter bar', 'Matched to species'],
  ['Catch reports banner', 'banner_reports', 'Catch reports feed', 'Matched to species'],
  ['Forum banner', 'banner_community', 'Top of the forum', 'Max 1 per screen'],

async function sponsors() {
  const [adv, camps, stats] = await Promise.all([sb.from('advertisers').select('*').order('name'), sb.from('ad_campaigns').select('*').order('starts_at', { ascending: false }), sb.from('ad_campaign_stats').select('*')]);
  const st = Object.fromEntries((must(stats) || []).map((s) => [s.id, s]));
  const advs = must(adv);
  $('#main').innerHTML = `<h2>Sponsors</h2><div class="card warn">Tip: use the <b>Ad Studio</b> (its own web address — SETUP.md Part P) to review, schedule and bill ads. Campaigns approved there show up in this list automatically; this page is for quick manual edits.</div>
  <div class="card"><h3>Campaigns</h3><table><tr><th>Campaign</th><th>Advertiser</th><th>Placement</th><th>Dates</th><th>Impressions</th><th>Clicks</th><th>CTR</th><th>Active</th></tr>
  ${must(camps).map((c) => `<tr><td>${esc(c.name)}<div class="muted">${esc(c.headline || '')} ${c.presented_by_section ? '· ' + esc(c.presented_by_section) : ''} ${esc((c.context_tags || []).join(', '))}</div></td>
  <td>${esc(advs.find((a) => a.id === c.advertiser_id)?.name)}</td><td>${esc(c.placement)}</td><td class="muted">${esc(c.starts_at.slice(0, 10))} → ${esc(c.ends_at.slice(0, 10))}</td>
  <td>${st[c.id]?.impressions ?? 0}</td><td>${st[c.id]?.clicks ?? 0}</td><td>${st[c.id]?.ctr_pct ?? '—'}%</td><td><input type="checkbox" data-camp="${c.id}" ${c.active ? 'checked' : ''}></td></tr>`).join('')}</table></div>
  <div class="card"><h3>Where every ad space is</h3><p class="muted">Want to see them? On your phone: Me → Admin → <b>Ad spaces preview</b> turns every slot into a gold placeholder.</p>
  <table><tr><th>Space</th><th>Placement / section</th><th>Where in the app</th><th>Guard rail</th></tr>${AD_SPACES.map(([n, k, w, g]) => `<tr><td><b>${esc(n)}</b></td><td class="muted">${esc(k)}</td><td>${esc(w)}</td><td class="muted">${esc(g)}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>New campaign</h3><div class="grid">
  <div><label>Advertiser</label><select id="a_adv">${advs.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>
  <div><label>Campaign name</label><input id="a_name"></div><div><label>Placement</label><select id="a_pl">${PLACEMENTS.map((p) => `<option>${p}</option>`).join('')}</select></div>
  <div><label>"Presented by" section</label><select id="a_sec"><option value="">—</option>${SECTIONS.map((p) => `<option>${p}</option>`).join('')}</select></div>
  <div><label>Logo / image URL (https)</label><input id="a_img"></div><div><label>Click-through URL</label><input id="a_click"></div>
  <div><label>Headline</label><input id="a_head"></div><div><label>Context tags (e.g. tuna, catalina)</label><input id="a_tags"></div>
  <div><label>Map position "lat, lon" (Featured pin only)</label><input id="a_pos" placeholder="33.7225, -118.2730"></div>
  <div><label>Start</label><input type="date" id="a_start"></div><div><label>End</label><input type="date" id="a_end"></div><div><label>Max per person per day</label><input id="a_cap" value="3"></div></div>
  <button class="act primary" id="a_add">Create campaign</button></div>
  <div class="card"><h3>Advertisers</h3>${advs.map((a) => `<div>${esc(a.name)} <span class="muted">${esc(a.contact_email || '')} ${esc(a.website || '')}</span></div>`).join('')}
  <div class="grid"><input id="v_name" placeholder="Business name"><input id="v_mail" placeholder="Contact email"><input id="v_web" placeholder="Website"></div><button class="act" id="v_add">Add advertiser</button></div>`;
  document.querySelectorAll('[data-camp]').forEach((el) => (el.onchange = async () => must(await sb.from('ad_campaigns').update({ active: el.checked }).eq('id', el.dataset.camp))));
  $('#v_add').onclick = async () => { must(await sb.from('advertisers').insert({ name: $('#v_name').value.trim(), contact_email: $('#v_mail').value.trim() || null, website: $('#v_web').value.trim() || null })); sponsors(); };
  $('#a_add').onclick = async () => {
    const pl = $('#a_pl').value, tags = $('#a_tags').value.split(',').map((x) => x.trim().toLowerCase()).filter(Boolean);
    let creative = null;
    if (pl === 'featured_listing') {
      const m = $('#a_pos').value.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
      if (!m) return alert('A Featured pin needs a map position: latitude, longitude (e.g. 33.7225, -118.2730).');
      if (!tags.some((t) => ['fuel', 'bait', 'marina'].includes(t))) return alert('Add fuel, bait or marina to Context tags so the pin shows with that layer.');
      creative = { kind: 'native', headline: $('#a_head').value.trim() || null, logo_url: $('#a_img').value.trim() || null, action_type: 'directions', action_value: `${m[1]},${m[2]}` };
    }
    must(await sb.from('ad_campaigns').insert({ ...(creative ? { creative } : {}), advertiser_id: +$('#a_adv').value, name: $('#a_name').value.trim(), placement: $('#a_pl').value, presented_by_section: $('#a_sec').value || null,
      creative_url: $('#a_img').value.trim(), click_url: $('#a_click').value.trim() || null, headline: $('#a_head').value.trim() || null,
      context_tags: $('#a_tags').value.split(',').map((x) => x.trim().toLowerCase()).filter(Boolean), region: 'socal',
      starts_at: new Date($('#a_start').value).toISOString(), ends_at: new Date($('#a_end').value + 'T23:59:59').toISOString(), max_per_user_per_day: parseInt($('#a_cap').value) || 3, active: true }));
    sponsors();
  };
}

  <div class="muted">${esc(r.starts_at.slice(0, 10))} → ${esc(r.ends_at?.slice(0, 10) || 'no end')}</div><button class="act" data-toggle="${r.id}" data-v="${r.active ? 0 : 1}">${r.active ? 'Turn off' : 'Turn on'}</button></div>`).join('')}`;

// ---------- data health (spec §58-59: know when NOAA stops updating before users complain) ----------
// ---------- Feedback & crashes ----------
async function feedback(view = 'feedback') {
  clearCharts();
  const tabs = `<div class="toolbar"><button class="act ${view === 'feedback' ? 'primary' : ''}" id="fbT">Feedback</button><button class="act ${view === 'crashes' ? 'primary' : ''}" id="crT">Crashes</button>
    <span class="muted">Sent from the app: Me → Send feedback, and automatic crash reports.</span></div>`;
  if (view === 'feedback') {
    const rows = must(await sb.from('app_feedback').select('*').order('created_at', { ascending: false }).limit(300));
    const icon = { bug: '🐞', idea: '💡', data: '🗺️', other: '💬' };
    $('#main').innerHTML = tabs + `<div class="kpis">${['new', 'seen', 'done'].map((k) => `<div class="kpi"><div class="k">${k}</div><div class="v">${rows.filter((r) => r.status === k).length}</div></div>`).join('')}</div>
    <div class="card"><table><tr><th></th><th>Message</th><th>From</th><th>When</th><th>Status</th></tr>${rows.map((r) => `<tr>
      <td style="font-size:20px">${icon[r.kind] || '💬'}</td><td style="max-width:520px">${esc(r.message)}<div class="muted">${esc([r.app_version && 'v' + r.app_version, r.device, r.area].filter(Boolean).join(' · '))}</div></td>
      <td>${r.email ? `<a style="color:var(--live)" href="mailto:${esc(r.email)}?subject=${encodeURIComponent('Re: your Channel Nav feedback')}">${esc(r.email)}</a>` : '<span class="muted">no email</span>'}</td>
      <td class="muted">${esc(ago(r.created_at))}</td>
      <td><select data-fb="${r.id}" style="width:auto">${['new', 'seen', 'done'].map((k) => `<option ${r.status === k ? 'selected' : ''}>${k}</option>`).join('')}</select></td></tr>`).join('') || '<tr><td colspan="5" class="muted">No feedback yet.</td></tr>'}</table></div>`;
    document.querySelectorAll('[data-fb]').forEach((el) => (el.onchange = async () => must(await sb.from('app_feedback').update({ status: el.value }).eq('id', el.dataset.fb))));
  } else {
    const groups = must(await sb.rpc('admin_error_groups', { days: 30 }));
    $('#main').innerHTML = tabs + `<div class="kpis"><div class="kpi"><div class="k">Different crashes (30 days)</div><div class="v">${groups.filter((g) => g.status === 'new').length}</div></div>
      <div class="kpi"><div class="k">Total reports</div><div class="v">${fmt(groups.reduce((a, g) => a + Number(g.n), 0))}</div></div></div>
    <div class="card"><p class="muted">Same crash = one row. Copy the details into your chat with Claude to get a fix. Mark "fixed" once the fix is shipped — if it comes back, it shows as new again.</p>
    <table><tr><th>Error</th><th>Times</th><th>App versions</th><th>Last seen</th><th></th></tr>${groups.map((g, i) => `<tr>
      <td style="max-width:560px">${g.fatal ? '<span class="bad">CRASH</span> ' : ''}<b>${esc(g.message)}</b><div class="muted">${esc(g.context || '')}</div>
      <details><summary class="muted">details</summary><pre id="st${i}">${esc(g.message)}\n${esc(g.context || '')}\n${esc(g.sample_stack || '')}</pre><button class="act" data-copy="${i}">Copy</button></details></td>
      <td>${fmt(g.n)}</td><td class="muted">${esc((g.versions || []).filter(Boolean).join(', '))}</td><td class="muted">${esc(ago(g.last_seen))}</td>
      <td>${g.status === 'new' ? `<button class="act" data-fix="${i}">Mark fixed</button><button class="act" data-ign="${i}">Ignore</button>` : `<span class="pill">${esc(g.status)}</span>`}</td></tr>`).join('') || '<tr><td colspan="5" class="good">No crashes reported. 🎉</td></tr>'}</table></div>`;
    const setStatus = async (i, status) => { must(await sb.from('app_errors').update({ status }).in('id', groups[i].ids)); feedback('crashes'); };
    document.querySelectorAll('[data-fix]').forEach((b) => (b.onclick = () => setStatus(+b.dataset.fix, 'fixed')));
    document.querySelectorAll('[data-ign]').forEach((b) => (b.onclick = () => setStatus(+b.dataset.ign, 'ignored')));
    document.querySelectorAll('[data-copy]').forEach((b) => (b.onclick = () => navigator.clipboard.writeText($('#st' + b.dataset.copy).textContent).then(() => (b.textContent = 'Copied'))));
  }
  $('#fbT').onclick = () => feedback('feedback'); $('#crT').onclick = () => feedback('crashes');
}

async function health() {
  // Nov 1: satellite products themselves arrive 1–3 days late (Copernicus gap-free chlorophyll ~3 days), plus the job runs twice a day
  const limits = { sst: 54, chl: 96, wind: 12, rules: 24 * 60, regs: 8 * 24 };
  let api = null, layers = [];
  try { api = await (await fetch(cfg.api + '/health')).json(); layers = (await (await fetch(cfg.api + '/layers')).json()).layers; } catch (e) { api = { status: 'unreachable', database: String(e) }; }
  const row = (key, label, t) => { const h = t ? (Date.now() - new Date(t)) / 36e5 : Infinity; const cls = !t ? 'bad' : h > limits[key] ? 'warn' : 'good'; return `<tr><td>${esc(label)}</td><td class="${cls}">${t ? esc(ago(t)) : 'missing'}</td><td class="muted">limit ${limits[key] >= 48 ? limits[key] / 24 + ' days' : limits[key] + ' h'}</td></tr>`; };
  const g = (k) => layers.find((l) => l.key === k) || {};
  const sources = must(await sb.from('data_sources').select('*').order('name'));
  $('#main').innerHTML = `<h2>Data health</h2><div class="card"><b>API</b>: <span class="${api.status === 'ok' ? 'good' : 'bad'}">${esc(api.status)}</span> · database: <span class="${api.database === 'ok' ? 'good' : 'bad'}">${esc(api.database)}</span></div>
  <div class="card"><table><tr><th>Layer</th><th>Latest data</th><th></th></tr>
  ${row('sst', 'Water temperature (SST)', g('sst').dates?.[0]?.observed_at)}${row('chl', 'Chlorophyll', g('chl').dates?.[0]?.observed_at)}${row('wind', 'Wind forecast run', g('wind').run)}${row('rules', 'MPAs & hazards checked', g('rules').checked_at)}${row('regs', 'Fish size & limits checked vs CDFW', g('regs').checked_at)}</table>
  ${(g('regs').changed || []).length ? `<div class="warn">CDFW changed these rules pages since the rules were written (${esc(g('regs').rules_checked)}): ${esc(g('regs').changed.join(', '))}. Ask Claude to update the fish size and limits.</div>` : ''}${(g('regs').failed || []).length ? `<div class="muted">Couldn't read this week: ${esc(g('regs').failed.join(', '))}</div>` : ''}
  ${g('regs').checked_at ? `<div class="muted">Fish rules self-check: ${g('regs').auto_key ? (g('regs').auto_mode === 'on' ? '<span class="good">ON — checked changes are applied</span>' : '<span class="warn">PREVIEW — shows what it would change, changes nothing</span>') : '<span class="warn">off — no Claude API key saved in GitHub</span>'}</div>` : ''}
  ${(g('regs').auto_changes || []).map((c) => `<div class="${c.applied ? 'good' : 'muted'}">${c.applied ? 'Changed' : 'Would change'}: ${esc(c.name)} ${esc(c.field === 'bag' ? 'bag limit' : 'size')} ${esc(c.old)} → <b>${esc(c.new)}</b> (${esc(c.on)}; reads ${esc(JSON.stringify(c.reads))})</div>`).join('')}
  ${Object.entries(g('regs').auto_unsure || {}).map(([id, u]) => `<div class="warn">Needs a person: ${esc(id)} — ${esc((u.why || []).join('; '))}</div>`).join('')}
  ${(g('regs').auto_changes || []).some((c) => c.applied) ? '<div class="muted">To take back automatic changes: GitHub → Actions → Ocean data → Run workflow → job: regs-undo</div>' : ''}
  ${(g('rules').layers || []).map((l) => `<div class="muted">${esc(l.label)}: ${l.available ? `<span class="good">${esc(l.count)} features</span>${l.stale ? ' <span class="warn">(last good copy — latest check failed)</span>' : ''}` : `<span class="warn">${esc(l.error || l.note || 'unavailable')}</span>`}</div>`).join('')}
  <p class="muted">If a layer goes amber/red: GitHub → Actions → Ocean data → look at the latest run's log.</p></div>
  <div class="card"><h3>Data-source registry</h3><table><tr><th>Source</th><th>Provider</th><th>Notes</th><th>Verified</th><th>Enabled</th><th></th></tr>
  ${sources.map((s) => `<tr><td>${esc(s.name)}</td><td class="muted">${esc(s.provider)}</td><td class="muted">${esc(s.commercial_notes || '')}</td><td class="${s.last_verified_at ? 'good' : 'warn'}">${s.last_verified_at ? esc(s.last_verified_at.slice(0, 10)) : 'not yet'}</td>
  <td><input type="checkbox" data-src="${s.id}" ${s.enabled ? 'checked' : ''}></td><td><button class="act" data-verify="${s.id}">Mark verified today</button></td></tr>`).join('')}</table></div>`;
  document.querySelectorAll('[data-src]').forEach((el) => (el.onchange = async () => must(await sb.from('data_sources').update({ enabled: el.checked }).eq('id', el.dataset.src))));
  document.querySelectorAll('[data-verify]').forEach((b) => (b.onclick = async () => { must(await sb.from('data_sources').update({ last_verified_at: new Date().toISOString() }).eq('id', b.dataset.verify)); health(); }));
}

async function audit() {

// ---------- start ----------
(async () => {
  if (!cfg) return setupForm();
  sb = supabase.createClient(cfg.url, cfg.key);
  const { data } = await sb.auth.getSession();
  if (!data.session) return signIn();
  me = data.session.user;
  const prof = (await sb.from('profiles').select('is_admin, display_name').eq('id', me.id).maybeSingle()).data;
  document.querySelectorAll('.who').forEach((w) => {
    w.innerHTML = `<div>Signed in as ${esc(me.email)}</div><a href="#" class="out">Sign out</a><a href="#" class="reset" style="color:var(--muted)">Change connection</a>`;
    w.querySelector('.out').onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };
    w.querySelector('.reset').onclick = (e) => { e.preventDefault(); localStorage.removeItem('admin-cfg'); location.reload(); };
  });
  if (!prof?.is_admin) { $('#main').innerHTML = '<div class="card bad">This account is not an admin. Set profiles.is_admin = true in Supabase for your account.</div>'; return; }
  show(fromSlug(location.hash.slice(1)) || 'Overview');
})();
